# Builds the Power Mode Switcher .exe files on GitHub.
#
# - Push a tag like v1.2.3: builds every file below (version 1.2.3) and attaches them to a new GitHub Release.
# - "Run workflow" on the Actions tab: test build only. The files are kept as a build artifact, no release.
#
# Files (one per entry in the "Build the .exe files" step):
#   PowerModeSwitcher-x64.exe               Intel/AMD, needs the .NET 10 Desktop Runtime (under 1 MB)
#   PowerModeSwitcher-x64-standalone.exe    Intel/AMD, runs without .NET installed (larger)
#   PowerModeSwitcher-arm64.exe             ARM (Snapdragon), needs the ARM64 .NET 10 Desktop Runtime (under 1 MB)
#   PowerModeSwitcher-arm64-standalone.exe  ARM (Snapdragon), runs without .NET installed (larger)
# The ARM64 files are cross-compiled on the x64 runner; the -r runtime identifier picks the architecture.
#
# To make a release:
#   git tag v1.2.3
#   git push origin v1.2.3

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - name: Build the .exe files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.value }}'

          # Standalone builds are NOT compressed: compression roughly halves the file but makes the
          # running app use about 75 MB more memory, which matters for a widget that runs all day.
          # Trimming (PublishTrimmed) is never used: it is not supported for WPF.
          $builds = @(
            @{ Rid = 'win-x64';   Name = 'PowerModeSwitcher-x64.exe';              SelfContained = $false }
            @{ Rid = 'win-x64';   Name = 'PowerModeSwitcher-x64-standalone.exe';   SelfContained = $true }
            @{ Rid = 'win-arm64'; Name = 'PowerModeSwitcher-arm64.exe';            SelfContained = $false }
            @{ Rid = 'win-arm64'; Name = 'PowerModeSwitcher-arm64-standalone.exe'; SelfContained = $true }
          )

          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($b in $builds) {
            $out = "publish/$($b.Name)"
            $publishArgs = @(
              'publish', 'src/PowerModeSwitcher', '-c', 'Release', '-r', $b.Rid,
              '--self-contained', $b.SelfContained.ToString().ToLower(),
              '-p:PublishSingleFile=true', '-p:DebugType=None', "-p:Version=$version", '-o', $out
            )
            if ($b.SelfContained) { $publishArgs += '-p:IncludeNativeLibrariesForSelfExtract=true' }

            Write-Host "Building $($b.Name)"
            dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $($b.Name)" }

            Copy-Item "$out/PowerModeSwitcher.exe" "dist/$($b.Name)"
            Write-Host ("  {0}: {1:N1} MB" -f $b.Name, ((Get-Item "dist/$($b.Name)").Length / 1MB))
          }

      - name: Keep the files as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PowerModeSwitcher-${{ steps.version.outputs.value }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.exe).FullName
          --title "Power Mode Switcher $env:GITHUB_REF_NAME"
          --generate-notes
