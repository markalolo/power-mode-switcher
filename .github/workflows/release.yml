# Builds PowerModeSwitcher.exe on GitHub.
#
# - Push a tag like v1.0.0: builds the .exe (version 1.0.0) and attaches it to a new GitHub Release.
# - "Run workflow" on the Actions tab: test build only. The .exe is kept as a build artifact, no release.
#
# To make a release:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - name: Build the single-file .exe
        shell: pwsh
        run: >
          dotnet publish src/PowerModeSwitcher
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Keep the .exe as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PowerModeSwitcher-${{ steps.version.outputs.value }}
          path: publish/PowerModeSwitcher.exe
          if-no-files-found: error

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME publish/PowerModeSwitcher.exe
          --title "Power Mode Switcher $env:GITHUB_REF_NAME"
          --generate-notes
